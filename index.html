<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Градоначальникъ</title>
<link rel="stylesheet" href="style.css?v=41">
</head>
<body>
<div id="app">
  <header id="top">
    <div id="title"><b>Градоначальникъ</b> <span id="era"></span> <span id="turnInfo"></span></div>
    <div id="goal"></div>
  </header>
  <div id="stats"></div>
  <main>
    <section id="scene">
      <div id="bg"></div>
      <div id="eventCard">
        <div id="evKind"></div>
        <h2 id="evTitle"></h2>
        <p id="evText"></p>
        <div id="log"></div>
        <form id="own">
          <input id="ownText" maxlength="200" autocomplete="off"
            placeholder="Своё решение: «разделить поровну», «простить в обмен на службу»…">
          <button>Решить</button>
        </form>
        <div id="hint">✦ Своё решение — главное. Или выбери один из вариантов:</div>
        <div id="choices"></div>
        <button id="nextBtn" class="hidden">Следующий ход →</button>
      </div>
    </section>
    <aside id="side">
      <h3>Совет</h3>
      <div id="council"></div>
      <div class="lawbox">
      <h3>Законы</h3>
      <div id="laws"></div>
      <form id="lawForm" onsubmit="event.preventDefault();newLaw()">
        <input id="lawText" maxlength="160" autocomplete="off"><button id="lawBtn">Издать</button>
      </form>
      </div>
      <div class="buildbox">
      <h3>Постройки</h3>
      <div id="builds"></div>
      </div>
      <div class="peoplebox">
      <h3>Люди по делам <span id="units"></span></h3>
      <div id="pop"></div>
      <div id="jobs"></div>
      <div id="forecast"></div>
      </div>
    </aside>
  </main>
</div>
<div id="overlay" class="hidden"><div id="ovBox"></div></div>
<script src="data.js?v=41"></script>
<script src="eras.js?v=41"></script>
<script src="history.js?v=41"></script>
<script src="eras2.js?v=41"></script>
<script src="ai.js?v=41"></script>
<script src="game.js?v=41"></script>
<script src="mech.js?v=41"></script>
<script src="saga.js?v=41"></script>
<script src="save.js?v=41"></script>
<script src="sound.js?v=41"></script>
</body>
</html>
